name: FireDoorLog
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
targets:
  FireDoorLog:
    type: application
    platform: iOS
    sources:
      - path: FireDoorLog
      - path: Shared
    dependencies:
      - target: FireDoorLogWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.fire-door-log
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: FireDoorLog/FireDoorLog.entitlements
    info:
      path: FireDoorLog/Info.plist
      properties:
        CFBundleDisplayName: Fire Door Inspection Log
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # PhotoField needs these. Say what the photo is actually for; Apple rejects vague strings.
        NSCameraUsageDescription: Take a photo to attach to a record.
        NSPhotoLibraryUsageDescription: Choose a photo to attach to a record.
        ITSAppUsesNonExemptEncryption: false
  FireDoorLogWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: FireDoorLogWidget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.fire-door-log.widget
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: FireDoorLogWidget/FireDoorLogWidget.entitlements
        SKIP_INSTALL: YES
    info:
      path: FireDoorLogWidget/Info.plist
      properties:
        CFBundleDisplayName: Fire Door Inspection Log Widget
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  FireDoorLogTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FireDoorLogTests
    dependencies:
      - target: FireDoorLog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.fire-door-log.tests
        GENERATE_INFOPLIST_FILE: YES
  FireDoorLogUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: FireDoorLogUITests
    dependencies:
      - target: FireDoorLog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.fire-door-log.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: FireDoorLog
schemes:
  FireDoorLog:
    build:
      targets:
        FireDoorLog: all
        FireDoorLogTests: [test]
        FireDoorLogUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: FireDoorLog/StoreKit/Products.storekit
    test:
      config: Debug
      storeKitConfiguration: FireDoorLog/StoreKit/Products.storekit
      targets:
        - FireDoorLogTests
        - FireDoorLogUITests
    archive:
      config: Release
